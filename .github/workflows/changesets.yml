name: Changesets

on:
  # Automatic runs are disabled because this maintenance workflow is not a
  # required CI check. Maintainers can still run it on demand when preparing
  # a release.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Maintain the Version Packages pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No publish-script is configured on purpose: this job only ever opens
      # or updates the "Version Packages" pull request. It never publishes.
      # A maintainer reviews and merges that PR, then separately pushes a
      # release tag to trigger .github/workflows/release.yml. See
      # docs/releasing.md and ADR 0009.
      - name: Open or update the Version Packages pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          create-github-releases: false
          push-git-tags: false

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag points at the current main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          tagged_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$tagged_sha" != "$main_sha" ]]; then
            echo "Release tag must point at the current main commit ($main_sha)" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata and tag
        id: release
        run: >-
          node scripts/release-manifest.mjs
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"

      - name: Run release quality gates
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  publish-npm:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: |
          pnpm --dir packages/contract-schema build
          pnpm --dir packages/formly-adapter build

      - name: Build and verify release tarballs
        run: >-
          node scripts/pack-release.mjs
          --destination "$RUNNER_TEMP/release-packages"

      - name: Preserve release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release-packages/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.0

      - name: Publish tarballs with npm trusted publishing
        shell: bash
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(
            find "$RUNNER_TEMP/release-packages" -maxdepth 1 -type f -name '*.tgz' | sort
          )
          if [[ "${#tarballs[@]}" -ne 2 ]]; then
            echo "Expected exactly two release tarballs, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/publish-release.mjs --tag "$NPM_TAG" "${tarballs[@]}"

  github-release:
    name: Create GitHub release
    needs:
      - verify
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release-packages

      - name: Create GitHub release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          release_args=(
            "$GITHUB_REF_NAME"
            "$RUNNER_TEMP"/release-packages/*.tgz
            --generate-notes
            --title "$GITHUB_REF_NAME"
            --verify-tag
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
